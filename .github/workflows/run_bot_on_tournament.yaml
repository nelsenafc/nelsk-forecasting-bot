name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  # Questions stay open 3 hours. GitHub drops most scheduled runs on this repo [2 of 33
  # fired on 5-6 Oct 2026], so the dependable trigger is an external cron calling
  # workflow_dispatch every 20 min. This schedule, at GitHub's 5-minute minimum, is the fallback.
  schedule:
    - cron: "3-58/5 * * * *"

# One run at a time, so a question is never forecast twice.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # to start the Notion log sync after a run that posted forecasts

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        id: bot
        run: poetry run python run.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Start the Notion log sync
        if: steps.bot.outputs.forecasts != '' && steps.bot.outputs.forecasts != '0'
        run: gh workflow run sync_forecast_log.yaml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub switches workflows off after 60 days without a commit, and its scheduler
      # barely fires on this repo, so the keepalive is started from here, where runs are frequent.
      - name: Start the keepalive after 40 quiet days
        if: always()
        run: |
          days_quiet=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$days_quiet" -ge 40 ]; then gh workflow run keepalive.yaml -R "$GITHUB_REPOSITORY"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      # No report artifacts here: this repo is public, and the reports hold forecasts for
      # questions other bots are still answering. The reasoning is kept on Metaculus as a
      # private comment on each question and becomes public once the question closes.
